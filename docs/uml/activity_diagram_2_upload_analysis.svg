  <text x="215" y="254" text-anchor="middle" font-size="10" fill="#64748b">Navigate to '/analytics'</text>

  <path d="M 325 243 L 490 243" fill="none" stroke="#0284c7" stroke-width="2" marker-end="url(#arr2)"/>

