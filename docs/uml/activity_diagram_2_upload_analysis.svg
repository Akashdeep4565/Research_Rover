  <rect x="30" y="20" width="1540" height="70" rx="12" fill="url(#headerGrad2)" filter="url(#shadow2)"/>
  <text x="50" y="50" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="2">UML 2.5 ACTIVITY DIAGRAM</text>
